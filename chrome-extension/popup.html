<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      color: #333;
      padding: 20px;
    }
    h1 {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 16px;
      color: #1a1a1a;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    h1 .logo { font-size: 20px; }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #666;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #1677ff; }
    .field { margin-bottom: 12px; }
    .actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }
    button {
      flex: 1;
      padding: 9px 0;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    #capture-btn {
      background: #1677ff;
      color: white;
    }
    #capture-btn:hover { background: #0958d9; }
    #capture-btn:disabled {
      background: #d9d9d9;
      cursor: not-allowed;
    }
    .status {
      margin-top: 10px;
      font-size: 12px;
      text-align: center;
      min-height: 16px;
    }
    .status.success { color: #52c41a; }
    .status.error { color: #ff4d4f; }
    .divider {
      border-top: 1px solid #f0f0f0;
      margin: 14px 0;
    }

    /* Login form */
    #login-section { margin-bottom: 4px; }
    #login-form .field { margin-bottom: 10px; }
    .remember-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      font-size: 12px;
      color: #666;
      user-select: none;
    }
    .remember-row input[type="checkbox"] {
      width: auto;
      margin: 0;
      cursor: pointer;
    }
    .remember-row label {
      display: inline;
      margin: 0;
      font-weight: 500;
      cursor: pointer;
    }
    #login-btn {
      width: 100%;
      padding: 9px 0;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      background: #1677ff;
      color: white;
      margin-top: 0;
    }
    #login-btn:hover { background: #0958d9; }
    .logged-in-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      background: #f6ffed;
      border: 1px solid #b7eb8f;
      border-radius: 6px;
      font-size: 12px;
      color: #389e0d;
    }
    .logged-in-info .username { font-weight: 600; }
    #logout-btn {
      background: none;
      border: none;
      color: #999;
      cursor: pointer;
      font-size: 12px;
      padding: 2px 6px;
      flex: none;
    }
    #logout-btn:hover { color: #ff4d4f; }

    /* Server URL toggle */
    .server-toggle {
      font-size: 11px;
      color: #999;
      cursor: pointer;
      text-align: right;
      margin-top: 6px;
    }
    .server-toggle:hover { color: #1677ff; }
    #server-section { display: none; }
    #server-section.visible { display: block; }
  </style>
</head>
<body>
  <h1><span class="logo">📎</span> GuanHe Web Clipper</h1>

  <!-- Server URL (collapsible) -->
  <div class="server-toggle" id="toggle-server">⚙ Server Settings</div>
  <div id="server-section">
    <div class="divider"></div>
    <div class="field">
      <label for="server-url">Server URL</label>
      <input type="text" id="server-url" placeholder="https://your-domain.com">
    </div>
    <button id="save-server-btn" style="width:100%;background:#f5f5f5;color:#333;margin-bottom:8px;">Save Server URL</button>
  </div>

  <div class="divider"></div>

  <!-- Auth section -->
  <div id="login-section">
    <div id="login-form">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter username" autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password" autocomplete="current-password">
      </div>
      <div class="remember-row">
        <input type="checkbox" id="remember-password" checked>
        <label for="remember-password">Remember password</label>
      </div>
      <button id="login-btn">Login</button>
    </div>
    <div id="logged-in" style="display:none;" class="logged-in-info">
      <span>✓ Logged in as <span class="username" id="display-username"></span></span>
      <button id="logout-btn">Logout</button>
    </div>
  </div>

  <div class="divider"></div>

  <div class="actions">
    <button id="capture-btn" disabled>Capture Page</button>
  </div>
  <div class="status" id="status"></div>

  <script src="popup.js"></script>
</body>
</html>

# logrotate config for Celery worker log files
#
# These files are written directly by Celery via the systemd --logfile flag,
# bypassing the Python RotatingFileHandler. Without this config they grow
# without bound (celery_ai_worker.log has reached 84 MB in production).
#
# Deploy: sudo cp deployment/logrotate.d/rc-celery.conf /etc/logrotate.d/rc-celery
# Test:   sudo logrotate --debug /etc/logrotate.d/rc-celery
#
# The `copytruncate` directive is critical: it copies the current log to a
# backup and then truncates the original in place, so the Celery process can
# keep writing to the same file descriptor without restarting.

/opt/guanhetech/logs/celery_ai_worker.log
/opt/guanhetech/logs/celery_data_worker.log {
    daily
    rotate 14
    compress
    delaycompress
    copytruncate
    missingok
    notifempty
    dateext
    dateformat -%Y-%m-%d
    su root root
}

# logrotate 配置 — YouTube Transcription Worker 日志
# 安装路径：/etc/logrotate.d/yt-worker
#
# 每天轮转，保留最近 7 天（7 个压缩文件 + 当天的 worker.log）。
# 使用 copytruncate：systemd 以 append 模式持续写入 worker.log，
# 进程不会重开文件句柄，故不能用 postrotate + kill -HUP 方式，
# 而是 copytruncate（先复制再清空原文件，不中断写入）。

/opt/local_virtual_service/logs/worker.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    dateext
    dateformat -%Y%m%d
    create 0640 root root
}

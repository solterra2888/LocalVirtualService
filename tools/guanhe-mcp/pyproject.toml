[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "guanhe-mcp"
version = "0.6.0"
description = "MCP server for GuanHe Agent API v0.6 (daily/weekly market reports, theme report, semantic search + vector RAG, SEC 13F holdings)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  # Keep the floor low enough to coexist with the backend pin httpx==0.25.2
  # (starlette 0.27 TestClient breaks on httpx>=0.28). Only basic Client API is used.
  "httpx>=0.24.0",
]

[project.scripts]
guanhe-mcp = "guanhe_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["guanhe_mcp*"]

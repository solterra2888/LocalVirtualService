# 定义后端服务的上游（Upstream）
upstream rc_webapp {
    server 127.0.0.1:8000;
}

upstream rc_scheduler {
    server 127.0.0.1:8001;
}

# ==================== HTTP -> HTTPS 重定向 ====================
server {
    listen 80;
    server_name www.guanhecapital.hk guanhecapital.hk; # 如果有域名，请替换为域名，例如 www.example.com

    # 将所有HTTP请求重定向到HTTPS
    return 301 https://$host$request_uri;
}

# ==================== HTTPS 主配置 ====================
server {
    listen 443 ssl;
    server_name www.guanhecapital.hk guanhecapital.hk; # 如果有域名，请替换为域名，例如 www.example.com

    # --- SSL 证书配置 ---
    # 请将以下路径替换为你实际的证书路径
    ssl_certificate cert/cert.pem;      # 证书文件（或 cert.pem）
    ssl_certificate_key cert/key.pem;    # 私钥文件（或 key.pem）

    # SSL 协议和加密套件配置（安全推荐）
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling（可选，需要证书支持）
    # ssl_stapling on;
    # ssl_stapling_verify on;

    # --- 前端配置 ---
    # 请根据你实际的前端 build/dist 目录修改此路径
    root /usr/share/nginx/html/guanhe; 
    index index.html;

    # 日志路径（建议与主配置分开，方便排查问题）
    access_log /var/log/nginx/rc_project_access.log acc;
    error_log /var/log/nginx/rc_project_error.log;

    # 安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;  # HSTS

    # 1. 前端路由处理：支持 React/Vue 的 History 模式
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. 静态资源缓存：直接由 Nginx 读取，不走代理
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 3. 后端 API 代理
    location /api/ {
        proxy_pass http://rc_webapp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 这里的 client_max_body_size 会覆盖全局的 100m 设置
        client_max_body_size 2048M; 
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }

    # 4. 专门针对音频上传的接口（更长的超时时间）
    location /api/files/upload-audio {
        proxy_pass http://rc_webapp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 2048M;
        client_body_timeout 600s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_request_buffering off;
    }

    # 5. 调度器接口代理
    location /scheduler/ {
        # 注意：这里的 /api/ 后缀会替换掉请求中的 /scheduler/
        proxy_pass http://rc_scheduler/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 健康检查
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # 禁止访问隐藏文件（如 .env, .git）
    location ~ /\. {
        deny all;
    }

    # 禁止访问敏感后缀文件
    location ~ \.(env|log|sql)$ {
        deny all;
    }
}

# 定义后端服务的上游（Upstream）
upstream rc_webapp {
    server 127.0.0.1:8000;
}

upstream rc_scheduler {
    server 127.0.0.1:8001;
}

# ==================== HTTP -> HTTPS 重定向 ====================
server {
    listen 80;
    server_name www.guanhecapital.hk guanhecapital.hk; # 如果有域名，请替换为域名，例如 www.example.com

    # 将所有HTTP请求重定向到HTTPS
    return 301 https://$host$request_uri;
}

    # ==================== HTTPS 主配置 ====================
    server {
    listen 443 ssl;
    # HTTP/2：单连接多路复用，替代 HTTP/1.1 的 6 连接排队——
    # 大陆跨境到香港的链路高丢包，每条 TCP 都要独立慢启动，多连接互相挤占；
    # 2026-11-16 排查华为手机打开官网极慢时开启（nginx 1.25.1+ 语法）
    http2 on;
    # HTTP/3（QUIC/UDP 443）：基于 UDP，丢包链路上无 TCP 队头阻塞、连接迁移友好，
    # 对大陆跨境高丢包路径的弱网恢复显著优于 h2。
    # 前置条件：① 官方镜像已带 --with-http_v3_module（nginx -V 确认）；
    #           ② 云安全组须放行 UDP 443（未放行时 Alt-Svc 协商失败自动回退 TCP h2，无副作用）
    listen 443 quic reuseport;
    http3 on;
    server_name www.guanhecapital.hk guanhecapital.hk; # 如果有域名，请替换为域名，例如 www.example.com

    # --- SSL 证书配置 ---
    # 请将以下路径替换为你实际的证书路径
    ssl_certificate cert/cert.pem;      # 证书文件（或 cert.pem）
    ssl_certificate_key cert/key.pem;    # 私钥文件（或 key.pem）

    # --- 压缩：覆盖主配置 nginx.conf 的 http 级 gzip_types ---
    # 必须显式包含 application/javascript：现行 mime.types 将 .js 映射为它，
    # 而主配置旧列表只有 application/x-javascript —— 导致 6.27MB 的 main.js
    # 从未压缩明文传输（gzip 后仅 1.77MB），跨境链路下首页白屏数十秒；
    # 2026-11-16 排查华为手机打开官网极慢时修复，并顺带补上 SVG
    gzip_types text/plain text/css application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # SSL 协议和加密套件配置（安全推荐）
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling（可选，需要证书支持）
    # ssl_stapling on;
    # ssl_stapling_verify on;

    # --- 前端配置 ---
    # 请根据你实际的前端 build/dist 目录修改此路径
    root /usr/share/nginx/html/guanhe; 
    index index.html;

    # 日志路径（建议与主配置分开，方便排查问题）
    access_log /var/log/nginx/rc_project_access.log acc;
    error_log /var/log/nginx/rc_project_error.log;

    # 安全响应头（含 Alt-Svc：向客户端广播 HTTP/3 可用，浏览器据此尝试 QUIC 升级）
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;  # HSTS
    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    # 1. 前端路由处理：支持 React/Vue 的 History 模式
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 1.1 SPA 入口禁用启发式缓存：index.html 必须每次回源校验，
    #     否则部署后浏览器可能继续跑旧 bundle（哈希 JS 已被 rsync --delete 删除，
    #     旧包却因 immutable 缓存在端上长期存活 —— 2026-11-14 Daily 下线后手机端复现）。
    #     命中路径: 直接 /index.html、目录索引 / 、try_files 兜底（内部重定向后均落到本 location）
    #     注意: 本 location 有自己的 add_header, server 级安全头不再继承, 必须在此重申
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
    }

    # 1.2 固定路径图标探测禁用长期缓存：浏览器/Safari 会按约定路径无参数探测
    #     /favicon.ico 与 /apple-touch-icon.png，无法靠 ?v= 换 URL 破缓存，
    #     这两条固定路径只允许短缓存（1h），图标内容更新最多 1 小时后端上生效。
    #     注意：本 location 有自己的 add_header，server 级安全头不再继承，需重申 nosniff
    location = /favicon.ico {
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
    }
    location = /apple-touch-icon.png {
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
    }

    # 2. 静态资源缓存：直接由 Nginx 读取，不走代理
    #    2.0 媒体文件单独开日志：2026-11-16 排查 iPhone Safari 视频卡加载态时
    #    发现 /media/ 命中下方通用正则后 access_log off，媒体加载完全无据可查；
    #    正则 location 按顺序先匹配优先，故置于通用静态正则之前
    location ~* ^/media/.+\.(mp4|webm|jpg|jpeg|png|gif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        access_log /var/log/nginx/rc_project_access.log acc;
    }

    #    2.1 其余静态资源：保持静默
    #    含 mp4/webm：背景视频此前无缓存头，SPA 内路由重挂载/重进页面时会
    #    从零重拉 6.9MB（日志实证同一设备几分钟内重复拉 3 次），跨境链路雪上加霜；
    #    视频更新靠 URL 加 ?v= 参数破缓存（见 LandingPage.tsx HERO_VIDEO_URL）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf|mp4|webm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        access_log off;
    }

    # 3. MCP 包下载（wheel 文件，pip install 使用）
    location /downloads/ {
        proxy_pass http://rc_webapp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # 4. Agent Skill 文档（FastAPI StaticFiles mount，不在 /api/ 前缀下）
    location /agent/skill/ {
        proxy_pass http://rc_webapp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # 5. 后端 API 代理
    location /api/ {
        proxy_pass http://rc_webapp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 这里的 client_max_body_size 会覆盖全局的 100m 设置
        client_max_body_size 2048M; 
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }

    # 6. 专门针对音频上传的接口（更长的超时时间）
    location /api/files/upload-audio {
        proxy_pass http://rc_webapp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 2048M;
        client_body_timeout 600s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_request_buffering off;
    }

    # 7. 调度器接口代理
    location /scheduler/ {
        # 注意：这里的 /api/ 后缀会替换掉请求中的 /scheduler/
        proxy_pass http://rc_scheduler/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 健康检查
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # 禁止访问隐藏文件（如 .env, .git）
    location ~ /\. {
        deny all;
    }

    # 禁止访问敏感后缀文件
    location ~ \.(env|log|sql)$ {
        deny all;
    }
}
